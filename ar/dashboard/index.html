<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لوحة المالك — FumeSociety</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f3ee;color:#252a28;font:16px/1.65 system-ui,sans-serif}header{background:#252a28;color:#f5f3ee;padding:22px max(6vw,20px);display:flex;justify-content:space-between;gap:20px}a{color:inherit;text-underline-offset:5px}header a{text-decoration:none}main{max-width:1080px;margin:60px auto;padding:0 22px}.eyebrow{font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:#686c61}h1{font:clamp(36px,6vw,60px)/1.1 Georgia,serif;margin:12px 0 20px}h2{font:26px/1.2 Georgia,serif;margin-top:0}.intro{max-width:680px;color:#63675f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:36px 0}.card,section{background:#fff;border:1px solid #dedfd5;border-radius:14px;padding:26px}.value{font-size:23px;margin:10px 0 0}.label{font-size:13px;color:#696f62}.badge{display:inline-block;background:#f2e5c9;color:#71581e;border-radius:20px;padding:5px 12px;font-size:13px}.details{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}li{margin:12px 0}.button{display:inline-block;padding:12px 20px;background:#303a2e;color:#fff;border-radius:8px;text-decoration:none;margin-top:12px}:focus-visible{outline:3px solid #a47737;outline-offset:4px}.note{font-size:14px;color:#65695f}footer{max-width:1080px;margin:30px auto;padding:0 22px 30px;font-size:13px;color:#65695f}@media(max-width:700px){.grid,.details{grid-template-columns:1fr}main{margin-top:35px}header{font-size:14px}}input{display:block;width:100%;padding:12px;margin:8px 0 20px;border:1px solid #b9bfb3;border-radius:8px;font:inherit}button{font:inherit;cursor:pointer;border:0}button:disabled{opacity:.5}#orders{display:grid;gap:18px;margin-top:24px;overflow-wrap:anywhere}#status{color:#71581e}[hidden]{display:none!important}</style></head><body><header><a href="/ar/">FumeSociety</a><nav><a href="/dashboard/">English</a> · <a href="/ar/">العودة للمتجر</a></nav></header><main><p class="eyebrow">FumeSociety</p><h1>لوحة المالك</h1><p id="status" role="status" aria-live="polite"></p><section id="login" style="max-width:480px"><h2>تسجيل دخول الإدارة</h2><p>سجّل الدخول لعرض طلبات العملاء.</p><form><label for="username">اسم المستخدم</label><input id="username" name="username" autocomplete="username" required maxlength="40"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button class="button" type="submit">تسجيل الدخول</button></form></section><div id="desk" hidden><section><h2>طلبات العملاء</h2><p>طلبات جديدة محفوظة من الموقع. أكّد كل طلب مع العميل؛ حفظ الطلب لا يعني الدفع أو إرسال رسالة واتساب.</p><button id="refresh" class="button">تحديث</button> <button id="logout" class="button">تسجيل الخروج</button></section><div id="orders"></div><button id="more" class="button" hidden>عرض المزيد</button></div><noscript>فعّل جافاسكربت لتسجيل الدخول.</noscript></main><footer>FumeSociety · إدارة المتجر</footer><script src="/admin-assets/dashboard.js" defer></script></body></html>
